  - name: Switcheroo Queer Contra Dance
    details: "Come one, come all to Switcheroo! A new queer contradance series hosted by NBCDS at Wischemann Hall in Sebastopol.\n\nThis is a new, gender-free, queer-normative contradance, focusing on welcoming new dancers, emphasizing consent and dancer safety, and building an inclusive, joyful, and exuberant dance community here in the North Bay. This is not an exclusively queer event–Allies and friends welcomed and encouraged! This is a family-friendly dance.\n\nThis month’s dance is a MASQUERADE BALL! Come with a costume and mask to add a little mystery to the night!\n\n7-7:30 Beginner’s Lesson\n\nCaller Sam Winter\n\nBand: Valerie Rose, Michelle Tan, and Christian Conaway\n\n$5-20 Sliding Scale, NOTAFLOF (No One Turned Away For Lack Of Funds)"
    links:
      - "https://nbcds.org/event/switcheroo-queer-contra-dance-2/"
    start: "2026-10-24T19:00:00-07:00"
    end: "2026-10-24T22:00:00-07:00"
    country: USA
    state: CA
    city: Sebastopol
    styles:
