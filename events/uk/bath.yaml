events:
  - name: Bath Folk Festival French Bal and Workshop
    details: "A workshop and dance event hosted by Steve Day and Daniel Woolverson, who bring their many decades of experience of playing and dancing French music both from the Massif Central and Brittany.\n\nThese dances are playful and energetic but also disciplined and gentle.\n\nThere will be an hour’s workshop followed by a dance with full band with French pipes, hurdy gurdy and fiddle.\n\nDaniel Wolverson: Hurdy-gurdy, violin\nSteve Day: Border bagpipes\n\nSteve and Daniel have played for French dance for many years, specialising in the music of the Massif central.\n\nThey were members of Cyser (with Giles Brown and Trudi Bide) who played at La Chavanée’s festival in 2010, where Frédéric Paris declared them “the best English band at Embraud.\n\nSteve, as part of Hot Springs, spent many years organising the annual ‘Le Grand Bal de Bath’ and other Bath-based dance and music events. \n\nDaniel also played for several years in the English band Boldwood and, recently, has laid claim to be the first person to play hurdy-gurdy in the Natural History Museum, at their 2025 Vampire Ball.\n\nAmong the duo’s bookings have been as the musicians (inc dance teaching) for a bal for the ‘d’Accord’ group in Exeter and as guest musicians at the French & Breton Dance week at Halsway Manor.\nVenue\nBath Laboratory of Culture\nBurdall’s Yard\n7a Anglo Terrace\nBath\nBA1 5NH\nAccessibility\nDisabled access via ramps\nDisabled toilets"
    links:
      - "https://bathfolkfestival.org/event/bal/"
