  - name: Maypole Teaching Development Day
    details: "Learn to teach Maypole dances, or develop your Maypole skills, with expert tutors Mike Ruff, Kerry Fletcher, Anne Garrison and Alison Rowley. This daytime educational event will offer dance material and tips galore for teaching and developing Maypole dancing in a variety of settings. Suitable for anyone who is interested in, or experienced in teaching or working with Maypole dancing.\n\nTicket price £35, soup lunch and teas and coffees included. Please let us know of any dietary requirements when booking; email info@oxfolk.org.uk\n\nThis training event is sponsored by Oxfolk Ceilidhs, with support from The English Folk Dance and Song Society.\n\nMain image - maypole with ribbons and people in the background - photo credit Folk Dance Remixed\n\n\n\nTickets and Payments\n- Ticket price £35, soup lunch and teas and coffees included. Please let us know of any dietary requirements when booking; email info@oxfolk.org.uk\n\n- Carer free - if you have a disability and need a personal assistant so that you can enjoy the workshop, we’re happy to provide you with an extra ticket for them, free of charge\n\nContact us for details of group discounts.\n\nAll under 16s must be accompanied by parent, guardian or an adult acting in loco parentis.\n\nWe accept online payments here with PayPal. Please contact us directly for other options.\nIllness and Refund Policy\n\n \tIf you're feeling unwell and may be suffering from a transmissible illness, please don't come and we'll refund.\n\nAccess Information\n\n \tIf you have a disability and need a personal assistant so that you can enjoy our events, we are happy to provide you with an extra ticket for them, free of charge. You can book a carer’s ticket when you book your own.\n \tThere is a accessible parking space adjacent to the Centre. There is level access into Kennington Village Hall with a ramp at the front of the centre. An accessible toilet is available.\n \tLighting is a combination of the standard lights in the hall, and some coloured stage lighting. We do not use flashing lights.\n \tThere is a quieter area in the lobby, which is next to the hall but also separate from it.\n\nIf you have any questions please contact us on info@oxfolk.org.uk"
