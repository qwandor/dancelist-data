  - name: Oxfolk Ceilidh
    details: "Doors 7.30pm, dancing from 8 until 11pm.\nThe Dirty Big Canal Dance Band - an Oxford ceilidh super group, drawing on members of Owl Light Trio and Xogara. Their soaring melodies are underpinned by funky rhythms. This is one classy party band! The line up is: Jane Griffiths - fiddle (Owl Light Trio), Jo Hamilton - sax, flute and bagpipes (Xogara), Jon Fletcher - mandolin, harmonica and banjo (Magpie Lane, Oxford Waites), Colin Fletcher - bass (Owl Light Trio, Tim Van Eyken) and John Ruddock (Xogara, Guerrilla Ceilidh, Rholben, Starling Sessions).\nWe are delighted that Oxford's Amy Gill is calling the dances. Bringing her wide range of dance experience to a ceilidh context, she creates an atmosphere in which everyone feels comfortable to dance. When not dancing, Amy can be found in sessions, performing as a singer and flute player, and studying history and folk music at Newcastle University.\nThe renowned Berkshire Bedlam join us to present precision Cotswold morris dancing for our half time entertainment.\nThere is a licensed bar with ale, cider, wine and soft drinks.\nTickets and Payments\n- Standard £14 on the door or £13 in advance\n- Concession (eg unwaged, low income, students, pensioners) - £9 on the door or £8.50 in advance\nWe don't ask for proof of concession: if you can't afford to pay the standard price, you are eligible for a concession, no questions asked\n- 5-16s £3 on the door or in advance\n- Under 5s free\n- Carer free - if you have a disability and need a personal assistant so that you can enjoy an evening at Oxfolk, we’re happy to provide you with an extra ticket for them, free of charge\nContact us for details of group discounts.\nAll under 16s must be accompanied by parent, guardian or an adult acting in loco parentis.\nWe accept online payments here with PayPal. Please contact us directly for other options.\nRefunds Policy and Illness\n\n\n \tIf you are ill with Covid or cold-like symptoms please don’t come - we will refund your tickets, no questions asked\n \tIf you can’t attend because of another illness please contact us to ask for a refund\n \tIf you can’t attend for another reason, and we are able to resell your ticket, we will refund your ticket\n\nAccess Information\n\n\n \tIf you have a disability and need a personal assistant so that you can enjoy our events, we are happy to provide you with an extra ticket for them, free of charge. You can book a carer’s ticket when you book your own.\n \tThere is a accessible parking space adjacent to the Centre. There is level access into Kennington Village Hall with a ramp at the front of the centre. An accessible toilet is available.\n \tLighting is a combination of the standard lights in the hall, and some coloured stage lighting. We do not use flashing lights.\n \tThere is a quieter area in the lobby, which is next to the hall but also separate from it.\n \tFor called dances our callers do not use gendered terms.\n\nIf you have any questions please contact us on info@oxfolk.org.uk"
