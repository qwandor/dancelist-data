  - name: Oxford Contra
    details: "Doors 7.30pm, contra basics lesson at 7.45pm, dancing until 11pm.\nContrasaurus (Benjamin Rowe — fiddle, Alan Brunier — accordion, Adam Rich-Griffin — guitar, David Ledsam — double bass) play an exciting range of energetic and dino-soaring tunes for American contra dancing. They enjoy playing fresh and exciting tunes for contra dances, workshops, folk clubs and festivals throughout England. Not technically dinosaurs.\nBob is a calm, friendly and accessible caller. He's been calling for over 15 years for everything from full costume LARP events to kids birthdays. He aims to call in a calm, clear manner, (he's even been described as \"suave\" to his great surprise) matching his calling to the audience in front of him. He aims for a varied and accessible programme with at least one dance leaving you going \"wait, how did that happen?\" Calling will be non gendered, and either positional (no role terms) or with role terms such as Larks and Robins.\nhttps://www.facebook.com/bobmorgancaller\nThere is no licensed bar at this event, so please feel free to bring your own drinks. Tea, coffee and squash will be available to buy, and water is freely available. We don’t use disposable glasses, so feel free to bring your own, or purchase an Oxfolk one at the event.\n\n\n\nTickets and Payments\n- Standard £14 on the door or in advance\n- Concession (eg unwaged, low income, students, pensioners) - £10 on the door or in advance\nWe don't ask for proof of concession: if you can't afford to pay the standard price, you are eligible for a concession, no questions asked\n- 5-16s £4 on the door or in advance\n- Under 5s free\n- Carer free - if you have a disability and need a personal assistant so that you can enjoy an evening at Oxfolk, we’re happy to provide you with an extra ticket for them, free of charge\nContact us for details of group discounts.\nAll under 16s must be accompanied by parent, guardian or an adult acting in loco parentis.\nWe accept online payments here with PayPal. Please contact us directly for other options.\nIllness and Refund Policy\n\n\n \t\nIf you're feeling unwell and may be suffering from a transmissible illness, please don't come and we'll refund.\n\n\nAccess\n\n\n \t\nIf you have a disability and need someone with you so that you can enjoy our events, we're happy to provide you with a ticket for them, free of charge. You can book a carer’s ticket when you book your own.\n\n \t\nThere is one accessible parking space adjacent to the Centre. There is level access into the Centre, with a ramp at the front. An accessible toilet is available.\n\n \t\nLighting is, depending on the time of day, natural light or the hall’s own lighting. We do not use flashing lights.\n\n \t\nThere is a quieter area in the lobby, which is next to the hall but also separate from it.\n\n \t\nFor called dances, use of non-gendered positional terms or alternative role names in calling is explained in the event description.\n\n\nIf you have any questions please contact us on oxfordcontra@gmail.com"
