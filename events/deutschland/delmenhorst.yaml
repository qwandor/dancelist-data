events:
  - name: Balfolk in der VHS
    details: "Heute spielt bei uns die Gruppe \"Flibberty\" und bringt uns \"Nordic Bal Folk with a Celtic Flavour\". Annika Geist (Klarinette, Gesang, etc.), Monika Braaksma (Geige, Diatonisches Akkordeon, Mandoline), Johannes Schiefner (Uilleann Pipes, Nyckelharpa, Gesang etc.) und Sijtse Braaksma (Gitarre, Bouzouki, Gesang) sind wahre Multi-Instrumentalisten. Die vier Musiker haben sich mit ganzem Herzen der traditionellen Tanzmusik der keltischen und baltischen Länder verschrieben. Zusammen lassen sie mit Groove, Feuer und dichtem Sound Füße wippen und locken das willige Publikum auf den Tanzboden.\nBalfolk beginnt um 14:30 Uhr, Tanzeinführung für Balfolk-Neulinge bereits um 13:30 Uhr. Spenden für unser Kuchenbuffet sind willkommen!"
