  - name: Folkestoltes
    details: Folkestoltes és un festival de referència pel ball folk i la música popular a Catalunya. El cartell amb una barreja de grups de l’escena internacional i local que ens oferiran concerts/balls en horari nocturn i tallers de música i dansa durant el dia. També cal destacar la Mostra Robert Pellicer que tindrà lloc la nit de dissabte on es presentaran noves propostes musicals catalanes d’arrel i la paella de diumenge per a tots els assistents del festival.
