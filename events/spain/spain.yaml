  - name: Ball dels innocents Qrambla
    details: "🎶 Ball dels innocents! Una tarda de folk amb Hartwin! 🪗\n\nDes de Flandes arriba Hartwin, acordionista i compositor amb un estil molt personal que combina la senzillesa i la bellesa de la música folk.\n\nAmb el seu acordió diatònic, Hartwin crea moments sonors plens d'emoció, sensibilitat i atmosfera. La seva música ens convida a viatjar, deixar-nos portar i connectar amb les emocions a través de cada melodia.\n\nUna jornada per descobrir la seva música de ben a prop, aprendre i, sobretot, compartir la passió pel folk!\n\n🪗 TALLER D'ACORDIÓ\n\n\nDe 15:00 a 17:45 h\nUna oportunitat per aprendre de la mà de Hartwin, descobrir el seu univers musical i aprofundir en les possibilitats de l'acordió diatònic.\nInscripcions a info@qrambla.com - 25€/persona\n\n💃 CONCERT BALFOLK\n\n\nDe 19:00 a 22:00 h\nPrepareu-vos per gaudir d'una vetllada de música folk i dansa, amb les melodies de Hartwin com a protagonistes. Una invitació a ballar, escoltar i compartir!\n\n📍 Lloc: Centre Cívic Barri Vell - Mercadal, Girona\n\nVeniu a gaudir d'una jornada plena de música, aprenentatge i ball! ❤️\n\nMés info a qrambla.cat"
    links:
      - "https://calendari.femudatraca.cat/event/ball-dels-innocents-qrambla-hartwin-dhoore-taller-i-concert-girona"
      - "https://www.instagram.com/p/Df7yBISIwV6/"
    start: "2026-12-28T19:00:00+01:00"
    end: "2026-12-28T22:00:00+01:00"
    country: Spain
    city: Girona
    styles:
      - balfolk
    workshop: false
    social: true
    bands:
      - Hartwin Dhoore
    price: donation
    organisation: QRambla
