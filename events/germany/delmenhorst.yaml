  - name: Balfolk in der VHS
    details: "Heute ist der NL Akkordeonist Wouter Kuyper bei uns zu Gast. Wir erwarten viele seiner eigenen Kompositionen, die auf traditionellen Balfolk-Rhythmen basieren, ob swingendem Scottish, intimer Mazurka, verträumtem Walzer (gerne auch ungerade), rockiger Bourrée, Polka, Polska, Hanter-Dro und vielen anderen.\nTanzeinführung für Balfolk-Neulinge bereits um 13:30 Uhr. Spenden für unser Kuchenbuffet sind willkommen!"
