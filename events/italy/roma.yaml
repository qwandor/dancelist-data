  - name: Corso di Balfolk Roma Tuscolana
    details: "Il lunedì sera cambia musica: entra nel mondo del Balfolk! 💃🕺\nVuoi staccare dalla solita routine, ricaricare le pile e iniziare la settimana con il sorriso?\nOgni lunedì sera ci incontriamo per uno spazio dinamico, leggero e travolgente. Niente lezioni noiose o impostate: solo la voglia di divertirsi insieme, scatenarsi sulla musica e conoscere tanta bella gente!\n🎶 Un viaggio tra tradizione e ritmi moderni: Riscopriamo le danze popolari europee (mazurka, scottish, bourrée...) con un tocco fresco e coinvolgente!\n✨ Cosa troverai al corso:\n•🥳 Tanto divertimento & Buona compagnia: Un’atmosfera calda e accogliente dove ci si allena sorridendo.\n•🎵 Ritmo e movimento: Imparerai a muoverti con fluidità, migliorare il tuo equilibrio e seguire la musica (anche se credi di avere due piedi sinistri!).\n•💡 Libertà di esprimerti: Impara le basi della guida e dell'ascolto, e poi mettici la tua personalità!\n🤝 Nessun partner? Zero problemi! Non serve venire in coppia:\nballiamo e ruotiamo tutti insieme, così s'impara più velocemente e si fa festa fin da subito!\n📅 QUANDO:\nTutti i lunedì | 20:30 – 22:00 📲 INFO E PRENOTAZIONI: Scrivici subito un messaggio su WhatsApp al 3474822407\n💥 Stacca la testa, sciogli le gambe e vieni a divertirti con noi! Ti aspettiamo in pista! 💥\n#balfolk #danzapopolare #divertimento #neotrad #musicaedanza #seratalunedì #balliamoinsieme #festa"
    links:
      - "https://www.facebook.com/events/1614956600215037/1614956606881703/"
    start: "2026-10-19T20:30:00+02:00"
    end: "2026-10-19T22:00:00+02:00"
